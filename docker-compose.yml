# Local development / CI stack: builds the frontend and backend from source.
# All configuration comes from the git-ignored .env file (see .env.example).
name: taskflow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
    volumes:
      # Named volume: data survives container removal and "docker compose down"
      - postgres_data:/var/lib/postgresql/data
      # Creates the tables on first start (runs only when the data volume is empty)
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - taskflow-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - taskflow-net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      # Hosts are the service names "postgres" and "redis", never localhost
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is not set in .env}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is not set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - taskflow-net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      # nginx resolves the "backend" hostname at startup, so wait for it
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - taskflow-net

volumes:
  postgres_data:

networks:
  taskflow-net:
    driver: bridge
